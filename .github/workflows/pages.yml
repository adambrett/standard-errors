name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.161.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Hugo
        run: |
          hugo_deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -sSL -o "${hugo_deb}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${hugo_deb}"
          curl -sSL -o hugo_checksums.txt \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${hugo_deb}$" hugo_checksums.txt | sha256sum -c -
          sudo dpkg -i "${hugo_deb}"

      - name: Build
        run: make build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
