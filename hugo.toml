baseURL = "https://standard-errors.adbr.dev/"
title = "Standard Errors"
theme = "standard-errors"
locale = "en-GB"

printPathWarnings = true
printUnusedTemplates = false
disableKinds = ["taxonomy", "term"]

[params]
  description = "A small standard for user-facing failure messages."

  [params.versions]
    current = "v0.1.0"
    list = ["v0.1.0"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    definitionList = true
    footnote       = true
    linkify        = true
    strikethrough  = true
    table          = true
    taskList       = true
    typographer    = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = false
  [markup.highlight]
    codeFences = false
[sitemap]
  changefreq = "weekly"
  priority   = 0.5
  filename   = "sitemap.xml"
